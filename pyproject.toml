[project]
name = "aisaas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.1"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "chromadb>=1.3.2",
    "fastapi[standard]>=0.121.0",
    "openai>=2.7.0",
    "orjson>=3.11.4",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.11.0",
    "python-jose[cryptography]>=3.5.0",
    "python-ulid>=3.1.0",
    "sqlalchemy-libsql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "cryptography>=42.0.5",
    "google-api-python-client>=2.120.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "twilio>=9.8.5",
    "stripe>=13.2.0",
    "argon2-cffi>=25.1.0",
    "scalar-fastapi>=1.4.3",
    "pypdf>=6.1.3",
    "redis[asyncio]>=5.0.1",
    "aiohttp>=3.13.2",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-attribute = "error"