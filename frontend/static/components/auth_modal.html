<div
    id="auth-modal"
    class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50"
>
    <div
        class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white"
    >
        <div class="text-right">
            <button
                id="close-auth-modal"
                class="text-gray-400 hover:text-gray-600 text-2xl font-semibold"
            >
                &times;
            </button>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-4 text-center">
            Login / Register
        </h2>

        <div id="auth-container">
            <div id="login-section">
                <h3 class="text-xl font-bold text-gray-800 mb-3">Login</h3>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="login-email" class="sr-only">Email</label>
                        <input
                            type="email"
                            id="login-email"
                            placeholder="Email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    <div>
                        <label for="login-password" class="sr-only"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="login-password"
                            placeholder="Password"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition duration-150"
                    >
                        Login
                    </button>
                </form>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Don't have an account?
                    <a
                        href="#"
                        id="show-register"
                        class="text-blue-600 hover:underline"
                        >Register here</a
                    >
                </p>
            </div>

            <div id="register-section" class="mt-8 hidden">
                <h3 class="text-xl font-bold text-gray-800 mb-3">Register</h3>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label for="register-email" class="sr-only"
                            >Email</label
                        >
                        <input
                            type="email"
                            id="register-email"
                            placeholder="Email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    <div>
                        <label for="register-password" class="sr-only"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="register-password"
                            placeholder="Password"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700 transition duration-150"
                    >
                        Register
                    </button>
                </form>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Already have an account?
                    <a
                        href="#"
                        id="show-login"
                        class="text-blue-600 hover:underline"
                        >Login here</a
                    >
                </p>
            </div>
        </div>
    </div>
</div>
